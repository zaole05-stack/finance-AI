[project]
name = "finance-ai"
version = "0.1.0"
description = "KI-Agenten fuer risikoreiche Investments mit Paper Trading"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: braucht Internet (Yahoo Finance); ausführen mit -m network"]
